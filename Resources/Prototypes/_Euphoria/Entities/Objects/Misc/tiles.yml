# mushwood floor
- type: entity
  name: mushwood floor
  parent: FloorTileItemBase
  id: FloorTileItemMushWood
  components:
  - type: Sprite # need to change
    sprite: _Euphoria/Objects/Misc/Tiles/mush_floor.rsi
    state: mushwood_tile
  - type: Item
    heldPrefix: mushwood
  - type: FloorTile
    outputs:
    - MushWoodFloor
  - type: Stack
    stackType: FloorTileMushWood
  - type: Construction
    graph: TileMushWood
    node: mushwoodtile

- type: tile
  id: MushWoodFloor
  name: mushwood floor
  sprite: /Textures/_Euphoria/Tiles/mushwood-floor.png
  variants: 1
  placementVariants:
  - 1.0
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: N14FootstepWood # gonna re-use this sound because i like it
  friction: 1.25
  itemDrop: FloorTileItemMushWood
  thermalConductivity: 0.04
  heatCapacity: 10000
  weather: false

- type: tile
  parent: MushWoodFloor
  id: MushWoodFloorBroken
  name: mushwood floor broken
  sprite: /Textures/_Euphoria/Tiles/mushwood-floor-broken.png

# Astro Lunar Regolith
- type: entity
  name: Lunar Regolith Floor
  description: The bean counters told me we literally could not afford seven spesos worth of moondust, much less seventy million. Bought it anyway, ground it up, turned it into a floor tile!
  parent: FloorTileItemBase
  id: FloorTileItemLunarRegolith
  components:
  - type: Sprite
    sprite: /Textures/_Euphoria/Tiles/astro-lunar-regolith.rsi
    state: LunarRegolith-icon
  - type: Item
    heldPrefix: asteroid
  - type: FloorTile
    outputs:
    - FloorFauxLunarRegolith
  - type: Stack
    stackType: StackFloorTileLunarRegolith
  # - type: Construction
  #   graph: TileMushWood
  #   node: mushwoodtile

- type: stack
  id: StackFloorTileLunarRegolith
  name: tiles-lunar-regolith
  spawn: FloorTileItemLunarRegolith
  maxCount: 30
